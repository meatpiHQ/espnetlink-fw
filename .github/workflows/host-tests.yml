# Standard §7: host-testable logic runs on the IDF `linux` target on every
# push — no hardware in the loop. Each suite is an idf.py project under
# components/<comp>/host_test whose built .elf exits non-zero on failure.
name: host-tests

on:
  push:
    branches: [main, refactor]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        suite:
          - components/settings_manager/host_test
          - components/log_manager/host_test
          - components/cmdline_manager/host_test
          - components/http_server_manager/host_test
          - components/dev_status_manager/host_test
          - components/wifi_manager/host_test
          - components/gps/host_test
          - components/lte_upstream_pppos/host_test
          - components/usb_cli_console/host_test
          - components/api_http/host_test
          - components/modem_manager/host_test
          - components/restart_tracker/host_test
          - components/ota_manager/host_test
          - components/mdns_manager/host_test
          - components/http_client_manager/host_test
          - components/imu_manager/host_test
          - components/vpn_manager/host_test
          - components/filesystem/host_test
          - components/cert_manager/host_test
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ${{ matrix.suite }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "${{ matrix.suite }}"
          idf.py --preview set-target linux
          idf.py build
          elf="$(ls build/*.elf)"
          echo "running $elf"
          "$elf"
