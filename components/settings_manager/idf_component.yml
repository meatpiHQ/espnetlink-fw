## Managed component dependencies for settings_manager.
## LittleFS is the filesystem the Settings Manager owns (see ARCHITECTURE.md §5).
## cJSON comes from the IDF v5.5 bundled `json` component (declared as a
## public REQUIRES in CMakeLists) — the espressif/cjson managed component is
## only needed from IDF v6 on.
dependencies:
  joltwallet/littlefs: "^1.14.0"
